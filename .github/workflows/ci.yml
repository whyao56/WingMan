name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 内核链路测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: 后端语法检查
        run: python -m compileall -q backend/app backend/tests scripts

      - name: 单元测试（音频管线 / 引擎状态 / 量纲回归）
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: 端到端冒烟测试（Mock Provider，无需任何 API Key）
        working-directory: backend
        run: python tests/test_smoke.py

      - name: 前端 JS 语法检查
        run: |
          cat > /tmp/check_frontend.js <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) {
            console.error('未在前端页面中找到 script 块');
            process.exit(1);
          }
          new (require('vm').Script)(m[1]);
          console.log('前端 JS 语法 OK');
          EOF
          node /tmp/check_frontend.js
